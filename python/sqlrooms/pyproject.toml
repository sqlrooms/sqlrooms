[project]
name = "sqlrooms"
dynamic = ["version"]
description = "Local-first SQLRooms project launcher for DuckDB documents and Mosaic dashboards."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "SQLRooms Contributors" }
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "click>=8.4.2",
  "cryptography>=46.0.5",
  "duckdb>=1.5.3,<1.6.0",
  "fastapi>=0.115.0",
  "idna>=3.15",
  "jinja2>=3.1.0",
  "mcp>=2.0.0,<3",
  "pyarrow>=17.0.0",
  "pygments>=2.20.0",
  "python-multipart>=0.0.32",
  "sqlrooms-server>=0.1.2",
  "starlette>=1.3.1",
  "tomli>=2.0.0; python_version < '3.11'",
  "tomlkit>=0.13.0",
  "typer>=0.12.5",
  "uvicorn>=0.30.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]
snowflake = ["pyjwt>=2.12.0", "snowflake-connector-python>=4.3.0"]
connectors = ["psycopg[binary]>=3.2.0", "pyjwt>=2.12.0", "snowflake-connector-python>=4.3.0"]

[project.urls]
homepage = "https://sqlrooms.org"
repository = "https://github.com/sqlrooms/sqlrooms"

[project.scripts]
sqlrooms = "sqlrooms.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio",
  "httpx",
  "ruff",
]

[tool.uv.sources]
sqlrooms-server = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["sqlrooms"]

[tool.hatch.build]
artifacts = ["sqlrooms/web/static/**"]

[tool.hatch.build.targets.sdist]
include = ["README.md", "LICENSE", "sqlrooms"]

[tool.hatch.version]
path = "package.json"
pattern = "\"version\": \"(?P<version>.+?)\""
