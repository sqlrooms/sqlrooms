name: Docs Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/assemble-versioned-docs.mjs'
      - 'scripts/check-typedoc-links.mjs'
      - 'scripts/fix-llms-api-links.mjs'
      - 'scripts/fix-typedoc-package-titles.mjs'
      - 'scripts/verify-docs-release.mjs'
      - 'packages/*/package.json'
      - 'packages/*/typedoc.json'
      - 'lerna.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/docs-checks.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'scripts/assemble-versioned-docs.mjs'
      - 'scripts/check-typedoc-links.mjs'
      - 'scripts/fix-llms-api-links.mjs'
      - 'scripts/fix-typedoc-package-titles.mjs'
      - 'scripts/verify-docs-release.mjs'
      - 'packages/*/package.json'
      - 'packages/*/typedoc.json'
      - 'lerna.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/docs-checks.yml'

permissions:
  contents: read

jobs:
  build-docs:
    name: Build and verify docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache for Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-docs-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-docs-

      - name: Build packages
        run: pnpm build

      - name: Build and verify docs
        run: pnpm docs:check
