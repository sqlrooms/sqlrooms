name: Docs Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/assemble-versioned-docs.mjs'
      - 'scripts/check-typedoc-links.mjs'
      - 'scripts/fix-llms-api-links.mjs'
      - 'scripts/fix-typedoc-package-titles.mjs'
      - 'scripts/verify-docs-release.mjs'
      - 'packages/*/package.json'
      - 'packages/*/src/**'
      - 'packages/*/typedoc.js'
      - 'packages/preset-typedoc/typedoc-base-config.js'
      - 'lerna.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/docs-checks.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'scripts/assemble-versioned-docs.mjs'
      - 'scripts/check-typedoc-links.mjs'
      - 'scripts/fix-llms-api-links.mjs'
      - 'scripts/fix-typedoc-package-titles.mjs'
      - 'scripts/verify-docs-release.mjs'
      - 'packages/*/package.json'
      - 'packages/*/src/**'
      - 'packages/*/typedoc.js'
      - 'packages/preset-typedoc/typedoc-base-config.js'
      - 'lerna.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/docs-checks.yml'

permissions:
  contents: read

jobs:
  build-docs:
    name: Build and verify docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache for Turbo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-docs-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-docs-

      - name: Build packages
        run: pnpm build

      - name: Build and verify docs
        run: pnpm docs:check
