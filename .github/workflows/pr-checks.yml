name: PR Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - 'python/**'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'python/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Cache for Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Check circular dependencies
        run: pnpm check-circular-deps

      - name: Check for unused dependencies and exports
        run: pnpm knip

      - name: Lint
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Verify canonical MCP contract
        run: |
          pnpm --filter sqlrooms-cli-app mcp:contract:generate
          git diff --exit-code -- python/sqlrooms/sqlrooms/mcp_tool_contract.json

      - name: Build apps
        run: pnpm build:apps

      - name: Verify installed Roomie distribution
        run: pnpm --filter roomie-node test:distribution

      - name: Typecheck examples
        run: pnpm typecheck:examples

      - name: Build isolated harness acceptance image
        run: |
          docker build -t roomie-harness-m4:local apps/roomie-node/container
          docker build -f apps/roomie-node/container/Dockerfile.test -t roomie-harness-m4-test:local apps/roomie-node
          echo "ROOMIE_ISOLATION_IMAGE=$(docker image inspect --format '{{.Id}}' roomie-harness-m4-test:local)" >> "$GITHUB_ENV"

      - name: Test
        run: pnpm test --filter='!./python/*'

      - name: Verify native Bubblewrap harnesses
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap apparmor-utils
          sh apps/roomie-node/bubblewrap/provision.sh /tmp/roomie-bwrap-runtime
          install -m 755 apps/roomie-node/test/isolated-codex.mjs /tmp/roomie-bwrap-runtime/test-codex.mjs
          install -m 755 apps/roomie-node/test/isolated-claude.mjs /tmp/roomie-bwrap-runtime/real-claude.mjs
          # Ubuntu restricts user namespaces. Grant only this test launcher the
          # documented userns permission, without changing a host-wide sysctl.
          sudo apparmor_parser -r apps/roomie-node/test/bubblewrap-ci.apparmor
          trap 'sudo apparmor_parser -R apps/roomie-node/test/bubblewrap-ci.apparmor' EXIT
          sudo aa-exec -p roomie-bwrap-ci -- unshare --mount --mount-proc \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
              --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
              --no-new-privs --pdeathsig=KILL --reset-env \
            env CI=1 ROOMIE_BWRAP_RUNTIME=/tmp/roomie-bwrap-runtime ROOMIE_ISOLATION_IMAGE="$ROOMIE_ISOLATION_IMAGE" \
            /tmp/roomie-bwrap-runtime/bin/node --test --test-concurrency=1 --test-timeout=60000 \
              --test-name-pattern=Bubblewrap apps/roomie-node/test/bubblewrap.test.mjs \
              apps/roomie-node/test/bubblewrap-claude.test.mjs apps/roomie-node/test/isolation.test.mjs \
              apps/roomie-node/test/service.test.mjs apps/roomie-node/test/gateway.test.mjs

      - name: Deterministic behavioral eval wiring
        run: pnpm evals:test
