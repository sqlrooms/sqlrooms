name: Behavioral Evals Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-canary:
    name: Document charts/maps canary
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PROMPTFOO_CONFIG_DIR: ${{ github.workspace }}/.promptfoo
      PROMPTFOO_DISABLE_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Run production-model scenarios
        run: pnpm evals:nightly --output artifacts/results.json --no-table

      - name: Export compact observatory summary
        if: always()
        run: pnpm evals:export --database "$PROMPTFOO_CONFIG_DIR/promptfoo.db" --output artifacts/summary.json --markdown artifacts/summary.md

      - name: Publish observatory summary
        if: always()
        run: |
          if [ -f artifacts/summary.md ]; then
            cat artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '_No behavioral eval summary was generated._' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload retained run history
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sqlrooms-behavioral-evals-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}/.promptfoo/promptfoo.db
            artifacts/results.json
            artifacts/summary.json
            artifacts/summary.md
