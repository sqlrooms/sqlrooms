name: Python PR Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'apps/sqlrooms-cli-ui/**'
      - '.github/workflows/pr-checks-python.yml'
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - 'python/**'
      - 'apps/sqlrooms-cli-ui/**'
      - '.github/workflows/pr-checks-python.yml'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.pull_request.user.login == 'renovate[bot]'

    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.23'
          enable-cache: true
          cache-dependency-glob: |
            python/uv.lock
            python/pyproject.toml
            python/*/pyproject.toml

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Build CLI UI bundle
        run: pnpm --filter sqlrooms-python build:ui
        working-directory: .

      - name: Build packages
        run: uv build --all

      - name: Verify sqlrooms wheel
        run: python sqlrooms/scripts/verify_wheel.py dist/sqlrooms-*.whl

      - name: Run tests
        run: uv run pytest
